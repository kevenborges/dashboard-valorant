<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valorant Dashboard</title>
    <!-- Imports padrão de fontes e Bootstrap para grid inicial rápida -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* Mesmas variaveis de estilo da página dashboard.html */
        :root {
            --val-red:    #ff4655;
            --val-dark:   #0f1923;
            --val-panel:  #1a2634;
            --val-border: rgba(255,255,255,0.08);
            --val-light:  #ece8e1;
            --val-muted:  #7f8fa6;
        }
        *, *::before, *::after { box-sizing: border-box; }
        
        /* Centraliza tudo na tela (como uma launch-page) */
        body {
            background-color: var(--val-dark);
            color: var(--val-light);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
        }
        .val-font { font-family: 'Bebas Neue', sans-serif; letter-spacing: 2px; }

        /* CARD PRINCIPAL (Formulário de Busca centralizado) */
        .main-card {
            background: var(--val-panel);
            border: 1px solid var(--val-border);
            padding: 40px 36px;
            width: 100%;
            max-width: 440px;
        }

        /* TÍTULO e LOGO TEXT */
        .logo-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 3.5rem;
            color: var(--val-red);
            line-height: 1;
            letter-spacing: 3px;
        }
        .logo-sub {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.1rem;
            color: var(--val-muted);
            letter-spacing: 4px;
            margin-bottom: 32px;
        }

        /* ESTILOS DE FORM: Inputs sem bordas arredondadas parecendo o client do LOL/VAL */
        .form-label {
            font-size: .7rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--val-muted);
            margin-bottom: 6px;
        }
        .form-control {
            background: rgba(0,0,0,.25);
            border: 1px solid rgba(255,255,255,.12);
            color: var(--val-light);
            border-radius: 0;
            font-family: 'Montserrat', sans-serif;
            font-size: .9rem;
            padding: 10px 14px;
        }
        .form-control:focus {
            background: rgba(0,0,0,.4);
            border-color: var(--val-red);
            color: var(--val-light);
            box-shadow: none;
        }
        .form-control::placeholder { color: rgba(255,255,255,.2); }
        .input-group-text {
            background: rgba(0,0,0,.3);
            border: 1px solid rgba(255,255,255,.12);
            border-right: none;
            color: var(--val-muted);
            border-radius: 0;
            font-weight: 700;
        }
        
        /* Botão Vermelho estilo Riot */
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--val-red);
            color: var(--val-light);
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.4rem;
            letter-spacing: 3px;
            border: 2px solid var(--val-red);
            border-radius: 0;
            transition: background .2s, color .2s;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn-submit:hover { background: transparent; color: var(--val-red); }

        /* ERRO: Caixa vermelha mostrada se API responder sem dados ou quando é deathmatch sem time */
        .erro-box {
            border: 1px solid var(--val-red);
            background: rgba(255,70,85,.08);
            padding: 10px 14px;
            font-size: .8rem;
            color: var(--val-red);
            margin-bottom: 20px;
            font-weight: 600;
        }

        /* HISTÓRICO LOCALSTORAGE: Painel com lista de perfis salvos por cookie/storage browser */
        .hist-section { margin-top: 28px; }
        .hist-title {
            font-size: .65rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--val-muted);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .hist-clear {
            font-size: .6rem;
            color: var(--val-muted);
            cursor: pointer;
            text-decoration: underline;
            background: none;
            border: none;
            padding: 0;
            letter-spacing: 1px;
        }
        .hist-clear:hover { color: var(--val-red); }
        .hist-list { display: flex; flex-direction: column; gap: 6px; }
        .hist-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,.03);
            border: 1px solid var(--val-border);
            padding: 8px 12px;
            cursor: pointer;
            transition: border-color .2s, background .2s;
        }
        .hist-item:hover { border-color: var(--val-red); background: rgba(255,70,85,.05); }
        .hist-item-name {
            font-weight: 700;
            font-size: .85rem;
        }
        .hist-item-tag { color: var(--val-muted); font-size: .75rem; margin-left: 4px; }
        .hist-item-arrow { color: var(--val-muted); font-size: .75rem; }
        #hist-empty { font-size: .75rem; color: var(--val-muted); text-align: center; padding: 10px 0; display: none; }
    </style>
</head>
<body>
    <div class="main-card">
        <div class="text-center mb-4">
            <div class="logo-title">VALORANT</div>
            <div class="logo-sub">Dashboard & Tracker</div>
        </div>

        <!-- Mensagem de erro que vêm via Jinja (ex: Deathmatch sem scoreboard) -->
        {% if erro %}
        <div class="erro-box">⚠ {{ erro }}</div>
        {% endif %}

        <!--
            Formulário principal: POST request no endpoind "/dashboard"
            Envia o Riot ID (Jogador) e a Tagline (#) separados.
        -->
        <form action="/dashboard" method="POST" id="search-form">
            <div class="mb-3">
                <label class="form-label">Riot ID</label>
                <input type="text" class="form-control" id="riot_id" name="riot_id" placeholder="Ex: kevz" required>
            </div>
            <div class="mb-4">
                <label class="form-label">Tagline</label>
                <div class="input-group">
                    <span class="input-group-text">#</span>
                    <input type="text" class="form-control" id="tagline" name="tagline" placeholder="Ex: gfbpa" required>
                </div>
            </div>
            <button type="submit" class="btn-submit">Consultar Perfil</button>
        </form>

        <!-- HISTÓRICO DE PESQUISAS INJETADO VIA JAVASCRIPT LOCAL (Navegador) -->
        <div class="hist-section" id="hist-section" style="display:none">
            <div class="hist-title">
                <span>Pesquisas Recentes</span>
                <button class="hist-clear" onclick="limparHistorico()">Limpar</button>
            </div>
            <div class="hist-list" id="hist-list"></div>
            <div id="hist-empty">Nenhuma pesquisa ainda.</div>
        </div>
    </div>

    <!-- LOGICA JAVASCRIPT DO SISTEMA DE LOCAL STORAGE DA LISTA DE BUSCA -->
    <script>
        // Cria chave local pra salvar pesquisas
        const STORAGE_KEY = 'val_search_history';
        const MAX_ITEMS   = 5;

        // Função: Carrega o histórico de array string JSON para Objetos ou Array vazio
        function carregarHistorico() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            } catch { return []; }
        }

        // Função: Grava a Array em stringficada de volta no storage (cookie local)
        function salvarHistorico(lista) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(lista));
        }

        // Função: Inseri a busca limitando ao máximo de 5 e retirando duplicações
        function adicionarAoHistorico(riot_id, tagline) {
            let lista = carregarHistorico();
            // Retira a dupla ID/Tag se ela já existir na lista (para adicionar pro topo em vez de duplicar)
            lista = lista.filter(i => !(
                i.riot_id.toLowerCase() === riot_id.toLowerCase() &&
                i.tagline.toLowerCase() === tagline.toLowerCase()
            ));
            // Adiciona no topo
            lista.unshift({ riot_id, tagline });
            // Força cortar fora se for > que maxitens permitidos
            lista = lista.slice(0, MAX_ITEMS);
            salvarHistorico(lista);
        }

        // Função: Lê a Array LocalStorage e constrói tags HTML <div> dinâmicas de cada item guardado
        function renderizarHistorico() {
            const lista   = carregarHistorico();
            const section = document.getElementById('hist-section');
            const listEl  = document.getElementById('hist-list');

            // Esconde UI de historico se nao tiver nada
            if (lista.length === 0) {
                section.style.display = 'none';
                return;
            }

            section.style.display = 'block';
            listEl.innerHTML = '';

            // Pra cada RiotID salvo, cria uma "Div Listagem" interativa
            lista.forEach(item => {
                const div = document.createElement('div');
                div.className = 'hist-item';
                div.innerHTML = `
                    <div>
                        <span class="hist-item-name">${item.riot_id}</span>
                        <span class="hist-item-tag">#${item.tagline}</span>
                    </div>
                    <span class="hist-item-arrow">→</span>
                `;
                // Event Listener pro Click. Se a pessoa clicar, injeta no Form os valores salvos e dá Submit auto.
                div.addEventListener('click', () => {
                    document.getElementById('riot_id').value = item.riot_id;
                    document.getElementById('tagline').value = item.tagline;
                    document.getElementById('search-form').submit();
                });
                listEl.appendChild(div);
            });
        }

        // Função: Deleta as chaves locais na aba Storage
        function limparHistorico() {
            salvarHistorico([]);
            renderizarHistorico();
        }

        // Ao dar um Submit com enter/click comum, guarda essa busca com prioridade no navegador do usuário
        document.getElementById('search-form').addEventListener('submit', function() {
            const riot_id = document.getElementById('riot_id').value.trim();
            const tagline = document.getElementById('tagline').value.trim();
            if (riot_id && tagline) adicionarAoHistorico(riot_id, tagline);
        });

        // Tenta renderizar tudo assim que o HTML dá boot 
        renderizarHistorico();
    </script>
</body>
</html>
